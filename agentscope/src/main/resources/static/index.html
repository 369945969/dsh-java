<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentScope</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif}
  body{background:#f5f5f5;height:100vh;display:flex;flex-direction:column}
  /* token 验证 */
  #gate{display:flex;align-items:center;justify-content:center;height:100vh;background:#1a1a1a}
  #gate .box{background:#fff;padding:40px;border-radius:12px;width:360px;text-align:center}
  #gate h2{margin-bottom:16px;color:#333}
  #gate input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:12px;font-size:14px}
  #gate button{width:100%;padding:10px;background:#4a6cf7;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px}
  #gate button:hover{background:#3a5ce5}
  /* 主布局 */
  #app{display:none;height:100vh}
  .sidebar{width:280px;background:#fff;border-right:1px solid #e0e0e0;display:flex;flex-direction:column;flex-shrink:0}
  .sidebar-header{padding:16px;font-weight:bold;font-size:16px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
  .sidebar-header button{background:#4a6cf7;color:#fff;border:none;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:13px}
  .conv-list{flex:1;overflow-y:auto}
  .conv-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:14px;color:#333}
  .conv-item:hover{background:#f5f5f5}
  .conv-item.active{background:#e8f0fe;color:#1a56db;font-weight:500}
  .main{flex:1;display:flex;flex-direction:column}
  .chat-area{flex:1;overflow-y:auto;padding:24px}
  .msg{margin-bottom:16px;max-width:80%}
  .msg.user{margin-left:auto;text-align:right}
  .msg .bubble{display:inline-block;padding:10px 16px;border-radius:12px;font-size:14px;line-height:1.6}
  .msg.user .bubble{background:#4a6cf7;color:#fff;border-bottom-right-radius:4px}
  .msg.assistant .bubble{background:#fff;border:1px solid #e0e0e0;border-bottom-left-radius:4px}
  .msg .tool{font-size:12px;color:#888;margin-top:4px;font-style:italic}
  .input-area{padding:16px 24px;border-top:1px solid #e0e0e0;display:flex;gap:12px;align-items:flex-end}
  .input-area textarea{flex:1;resize:none;border:1px solid #ddd;border-radius:8px;padding:10px;font-size:14px;max-height:120px;min-height:42px}
  .input-area button{background:#4a6cf7;color:#fff;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;font-size:14px;white-space:nowrap}
  .input-area button:disabled{background:#aaa}
</style>
</head>
<body>

<!-- Token 验证页 -->
<div id="gate">
  <div class="box">
    <h2>AgentScope</h2>
    <input id="tokenInput" type="password" placeholder="输入访问 Token" />
    <button onclick="login()">进入</button>
    <p style="margin-top:8px;font-size:12px;color:#999">通过 ?token= 或此页输入 token 验证</p>
  </div>
</div>

<!-- 主界面 -->
<div id="app">
  <div class="sidebar">
    <div class="sidebar-header">对话列表<button onclick="newConv()">+ 新对话</button></div>
    <div class="conv-list" id="convList"></div>
  </div>
  <div class="main">
    <div class="chat-area" id="chatArea"></div>
    <div class="input-area">
      <textarea id="msgInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter'&&!event.shiftKey)send()"></textarea>
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
